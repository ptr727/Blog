<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="t">
  <title id="t">Viljoen coat of arms: Gules, a saltire Or; crest a pair of eagle's wings folded Or; mantling Or and Gules</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe08a"/>
      <stop offset=".45" stop-color="#e2ad3b"/>
      <stop offset="1" stop-color="#a8711a"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe08a"/>
      <stop offset=".6" stop-color="#dca436"/>
      <stop offset="1" stop-color="#a8711a"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d0343a"/>
      <stop offset=".55" stop-color="#a81d24"/>
      <stop offset="1" stop-color="#6e1016"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbfc"/>
      <stop offset=".5" stop-color="#c6cad1"/>
      <stop offset="1" stop-color="#6f7680"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".35" cy=".25" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </radialGradient>
    <clipPath id="shieldClip">
      <path d="M118,196 H282 V300 C282,356 246,392 200,410 C154,392 118,356 118,300 Z"/>
    </clipPath>

    <!-- One side of the mantling; the other side is its mirror image -->
    <g id="mantle">
      <!-- gold lining shows as the turned-back edge -->
      <path fill="url(#gold)" stroke="#6b4210" stroke-width="1.5" stroke-linejoin="round" transform="translate(-5,5)"
        d="M198,124 C166,118 136,128 118,150 C100,172 74,168 64,148 C58,134 66,122 78,124
           C72,136 78,146 90,146 C76,164 70,190 86,206 C66,210 46,198 44,180
           C38,198 44,222 66,230 C54,248 56,276 76,286 C56,292 38,284 32,266
           C26,292 46,318 76,318 C68,338 78,360 102,366 C86,378 74,392 76,410
           C98,406 118,392 128,374 L140,300 L128,222 L150,188 L186,150 Z"/>
      <path fill="url(#red)" stroke="#4a0a0e" stroke-width="1.5" stroke-linejoin="round"
        d="M198,124 C166,118 136,128 118,150 C100,172 74,168 64,148 C58,134 66,122 78,124
           C72,136 78,146 90,146 C76,164 70,190 86,206 C66,210 46,198 44,180
           C38,198 44,222 66,230 C54,248 56,276 76,286 C56,292 38,284 32,266
           C26,292 46,318 76,318 C68,338 78,360 102,366 C86,378 74,392 76,410
           C98,406 118,392 128,374 L140,300 L128,222 L150,188 L186,150 Z"/>
      <!-- fold lines -->
      <g fill="none" stroke="#5a0c11" stroke-width="1.6" stroke-linecap="round" opacity=".7">
        <path d="M170,134 C146,142 126,160 112,188"/>
        <path d="M130,196 C112,214 102,236 100,262"/>
        <path d="M122,280 C110,300 104,320 108,344"/>
      </g>
    </g>

    <!-- One eagle's wing, folded and elevated; the pair is this and its mirror -->
    <g id="wing">
      <path fill="url(#goldV)" stroke="#6b4210" stroke-width="1.6" stroke-linejoin="round"
        d="M200,108 C186,110 168,106 158,94 Q148,90 140,82 L154,80 Q144,74 138,64 L152,63
           Q144,56 141,46 L155,48 Q150,40 150,30 L162,36 Q160,26 164,16 L172,26 Q174,14 182,6
           C192,24 199,44 200,66 Z"/>
      <!-- primary feathers -->
      <g fill="none" stroke="#7a4e0c" stroke-width="1.3" stroke-linecap="round">
        <path d="M154,80 C170,86 184,92 197,97"/>
        <path d="M152,63 C168,72 184,80 197,86"/>
        <path d="M155,48 C170,58 184,66 198,74"/>
        <path d="M162,36 C174,46 186,54 198,62"/>
        <path d="M172,26 C182,36 190,44 198,52"/>
      </g>
      <!-- scalloped coverts at the shoulder -->
      <path fill="none" stroke="#7a4e0c" stroke-width="1.2"
        d="M199,100 C196,105 189,105 187,100 C184,105 177,104 176,99 C172,102 166,99 166,94"/>
    </g>
  </defs>

  <!-- Mantling -->
  <use href="#mantle"/>
  <use href="#mantle" transform="translate(400,0) scale(-1,1)"/>

  <!-- Shield -->
  <g>
    <path d="M118,196 H282 V300 C282,356 246,392 200,410 C154,392 118,356 118,300 Z" fill="url(#red)"/>
    <g clip-path="url(#shieldClip)" stroke-linecap="butt">
      <g stroke="#7a4e0c" stroke-width="44">
        <path d="M100,176 L315,422"/>
        <path d="M300,176 L85,422"/>
      </g>
      <g stroke="url(#gold)" stroke-width="38">
        <path d="M100,176 L315,422"/>
        <path d="M300,176 L85,422"/>
      </g>
    </g>
    <path d="M118,196 H282 V300 C282,356 246,392 200,410 C154,392 118,356 118,300 Z" fill="url(#sheen)"/>
    <path d="M118,196 H282 V300 C282,356 246,392 200,410 C154,392 118,356 118,300 Z"
          fill="none" stroke="#3b1a08" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Helm (esquire's closed helm, in profile) -->
  <g stroke="#2f3338" stroke-width="1.6" stroke-linejoin="round">
    <path fill="url(#steel)" d="M166,206 C176,194 226,192 240,198 L248,208 C222,202 186,202 160,210 Z"/>
    <path fill="url(#steel)"
      d="M180,200 C172,196 166,188 166,180 L159,168 L167,160 L161,150 C163,132 176,117 198,114
         C223,112 241,128 241,152 C241,172 237,188 233,200 Z"/>
    <path fill="none" stroke-width="3" d="M163,150 C184,146 206,146 226,151"/>
    <path fill="none" d="M167,160 C186,158 206,158 222,162"/>
    <g fill="#2f3338" stroke="none">
      <circle cx="176" cy="170" r="1.8"/><circle cx="184" cy="170" r="1.8"/>
      <circle cx="192" cy="170" r="1.8"/><circle cx="176" cy="178" r="1.8"/>
      <circle cx="184" cy="178" r="1.8"/><circle cx="192" cy="178" r="1.8"/>
    </g>
    <circle cx="226" cy="156" r="4.5" fill="url(#gold)"/>
    <path fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".75"
          d="M178,130 C186,122 198,119 210,120"/>
  </g>

  <!-- Crest: a pair of eagle's wings folded Or -->
  <use href="#wing"/>
  <use href="#wing" transform="translate(404,0) scale(-1,1)"/>

  <!-- Torse (wreath) of the liveries, Or and Gules -->
  <g>
    <clipPath id="torseClip"><rect x="168" y="102" width="68" height="15" rx="7.5"/></clipPath>
    <g clip-path="url(#torseClip)" stroke="#4a2a08" stroke-width=".8">
      <path fill="url(#gold)" d="M158,102 h12 l-5,15 h-12 z"/>
      <path fill="url(#red)"  d="M170,102 h12 l-5,15 h-12 z"/>
      <path fill="url(#gold)" d="M182,102 h12 l-5,15 h-12 z"/>
      <path fill="url(#red)"  d="M194,102 h12 l-5,15 h-12 z"/>
      <path fill="url(#gold)" d="M206,102 h12 l-5,15 h-12 z"/>
      <path fill="url(#red)"  d="M218,102 h12 l-5,15 h-12 z"/>
      <path fill="url(#gold)" d="M230,102 h12 l-5,15 h-12 z"/>
      <path fill="url(#red)"  d="M242,102 h12 l-5,15 h-12 z"/>
    </g>
    <rect x="168" y="102" width="68" height="15" rx="7.5" fill="none" stroke="#3b1a08" stroke-width="1.4"/>
  </g>
</svg>
