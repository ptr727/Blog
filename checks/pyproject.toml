# Tool configuration only, since these gates ship nothing.

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.12"
platform = "linux"
files = ["."]

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true

# The normalizer sits in scripts/, a directory of its own that this one's type check does not read.
[[tool.mypy.overrides]]
module = ["normalize_media"]
ignore_missing_imports = true
