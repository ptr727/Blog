# Tool configuration only, since these gates are standard library alone and ship nothing.

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.12"
platform = "linux"
files = ["."]

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]
