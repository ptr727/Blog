name: Deploy site action

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy.
        required: true
        type: choice
        options:
          - staging
          - production

# Runs queue rather than cancel, because a cancelled deploy leaves a release uploaded and unflipped.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:

  # Staging deploys from any ref, since proving a branch before it merges is what staging is for.
  # First, so a mis-dispatched production deploy fails before anything is installed or written.
  # Compared against the full ref rather than ref_name, because tags and branches are separate namespaces that share a short name.
  # A tag named main would satisfy a ref_name comparison while pointing at an arbitrary commit, which is a bypass of the one gate protecting production.
  assert-ref:
    name: Assert deploy ref job
    runs-on: ubuntu-latest
    # Nothing here reads the repository, so it needs no token scope at all.
    permissions: {}
    steps:
      - name: Assert ref matches environment step
        run: |
          set -Eeuo pipefail
          if [ "${{ inputs.environment }}" = "production" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Deploy production from main; got ${{ github.ref }}."
            exit 1
          fi

  # The same gate the pull request and a release run.
  validate:
    name: Validate sources job
    needs: [ assert-ref ]
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@fa63163f4400830a6d86d306a2f9b542ca1a5c4a # 2.0.465
    permissions:
      contents: read
    with:
      # This repo's whole Hugo content tree (content/) and the vendored PaperMod theme are both excluded here.
      # .markdownlint-cli2.jsonc is carried verbatim, so it cannot scope them locally.
      markdown-exclude-globs: |
        !content/**
        !themes/*/**
      # The vendored theme stays byte-identical to upstream.
      # Its own floating-tag action pins are never locally edited to satisfy this repo's sha-pin gate.
      repo-gate-exclude-globs: |
        themes/*/**

  deploy:
    name: Deploy site job
    needs: [ validate ]
    uses: ptr727/ProjectTemplate/.github/workflows/deploy-site-task.yml@fa63163f4400830a6d86d306a2f9b542ca1a5c4a # 2.0.465
    with:
      environment: ${{ inputs.environment }}
    permissions:
      contents: read
    # Cross-repo, so secrets: inherit does not apply.
    # Production maps both auth-token secrets to empty, since neither is set there, which the hub task's own assert step treats as a public site.
    secrets:
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      SITE_AUTH_TOKEN_ID: ${{ secrets.SITE_AUTH_TOKEN_ID }}
      SITE_AUTH_TOKEN: ${{ secrets.SITE_AUTH_TOKEN }}
