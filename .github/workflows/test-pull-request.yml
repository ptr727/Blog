name: Test pull request action

# Thin caller: the gate is the hub's reusable validate-task.yml, which this repo reaches rather than carries.
# This is a release-model repo with no build target, so the trigger is pull_request only.
# It has no direct-commit allowance to keep advisory.
on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  validate:
    name: Validate sources job
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@3927fec1e5d6b6b756d8ddbc6763c658a2804b91 # 2.0.445
    permissions:
      contents: read
    with:
      # This repo vendors the PaperMod theme and carries an imported WordPress content archive, neither authored here.
      # .markdownlint-cli2.jsonc is carried verbatim, so it cannot scope them locally.
      markdown-exclude-globs: |
        !content/**
        !themes/*/**

  # GitHub Actions does not support required status checks on conditional jobs.
  # A single always-run aggregator therefore gates the merge.
  # Its name is the ruleset-bound required status-check context.
  # Rename it and the ruleset context together, never independently.
  check-workflow-status:
    name: Check pull request workflow status job
    runs-on: ubuntu-latest
    needs: [ validate ]
    if: always()
    steps:
      - name: Check workflow results step
        run: |
          set -Eeuo pipefail
          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "Job 'validate' did not succeed (${{ needs.validate.result }}); refusing to pass."
            exit 1
          fi
