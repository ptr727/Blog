name: Publish project release action

on:
  workflow_dispatch:

# A publish is a deliberate dispatch, so runs serialize on one group and queue rather than cancel.
# That keeps a run from being left with a half-created GitHub release.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:

  # Single source of the release-gate decision (publish or not, stable or not), reused by every job below.
  # Also replaces this repo's own dispatch-ref assertion: the hub task errors identically on a ref other than main/develop.
  plan:
    name: Plan release job
    uses: ptr727/ProjectTemplate/.github/workflows/publish-plan-task.yml@be4d3bf0a6c87adebe3aa27d32a57291c8a919b9 # 2.0.453
    with:
      event_name: ${{ github.event_name }}
      actor: ${{ github.actor }}
      ref_name: ${{ github.ref_name }}

  # The same reusable gate the pull request runs.
  # A dispatch cannot release a ref that fails validation.
  # No ref input to pin: the called workflow already checks out this run's dispatch-time github.sha by default.
  # That is the same commit the publish job below builds.
  validate:
    name: Validate sources job
    needs: [plan]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@be4d3bf0a6c87adebe3aa27d32a57291c8a919b9 # 2.0.453
    permissions:
      contents: read
    with:
      # This repo's whole Hugo content tree (content/) and the vendored PaperMod theme are both excluded here.
      # .markdownlint-cli2.jsonc is carried verbatim, so it cannot scope them locally.
      markdown-exclude-globs: |
        !content/**
        !themes/*/**
      # The vendored theme stays byte-identical to upstream.
      # Its own floating-tag action pins are never locally edited to satisfy this repo's sha-pin gate.
      repo-gate-exclude-globs: |
        themes/*/**

  # Publish the dispatched branch, where main is a release and develop a prerelease.
  # NBGV computes the tag; the release is the tag plus the auto source archive, README, and LICENSE.
  # This is a source-only repo with no build targets, so every enable_* input is false.
  publish:
    name: Publish project release job
    needs: [plan, validate]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@be4d3bf0a6c87adebe3aa27d32a57291c8a919b9 # 2.0.453
    permissions:
      contents: write
      actions: write
    with:
      # Full history for NBGV.
      # Pin the dispatch-time commit, since a push landing after dispatch must not release unvalidated.
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      smoke: false
      github: true
      enable_docker: false
      enable_nuget: false
      enable_pypi: false
      enable_dotnet_publish: false
      expect_release_assets: false
