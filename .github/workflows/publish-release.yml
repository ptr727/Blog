name: Publish project release action

on:
  workflow_dispatch:

# A publish is a deliberate dispatch, so runs serialize on one group and queue rather than cancel.
# That keeps a run from being left with a half-created GitHub release.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:

  # Single source of the release-gate decision (publish or not, stable or not), reused by every job below.
  # Also replaces this repo's own dispatch-ref assertion: the hub task errors identically on a ref other than main/develop.
  plan:
    name: Plan release job
    uses: ptr727/ProjectTemplate/.github/workflows/publish-plan-task.yml@37aa042042f51655ce368ec62dd1a655ac4b3716 # 2.0.428
    with:
      event_name: ${{ github.event_name }}
      actor: ${{ github.actor }}
      ref_name: ${{ github.ref_name }}

  # The same reusable gate the PR runs - a dispatch cannot release a ref that fails validation.
  # This repo's own validate-task.yml carries the Hugo build and URL-parity gate alongside the generic
  # linters (see AGENTS.md/GOVERNANCE.md for why this repo has not yet adopted the hub-hosted validate-task.yml).
  validate:
    name: Validate sources job
    needs: [plan]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    uses: ./.github/workflows/validate-task.yml
    permissions:
      contents: read

  # Publish the dispatched branch, where main is a release and develop a prerelease.
  # NBGV computes the tag; the release is the tag plus the auto source archive, README, and LICENSE.
  # This is a source-only repo with no build targets, so every enable_* input is false.
  publish:
    name: Publish project release job
    needs: [plan, validate]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@37aa042042f51655ce368ec62dd1a655ac4b3716 # 2.0.428
    permissions:
      contents: write
      actions: write
    with:
      # Full history for NBGV; pin the dispatch-time commit - a push landing after dispatch must not release unvalidated.
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      smoke: false
      github: true
      enable_docker: false
      enable_nuget: false
      enable_pypi: false
      enable_dotnet_publish: false
      expect_release_assets: false
