name: Validate task

# The single validation gate, reused by test-pull-request (feeding the required check) and publish-release.

on:
  workflow_call:
    inputs:
      # Empty (the default) checks out github.sha, which is already the dispatch-time commit for
      # every job in this run. A caller that publishes/deploys off a separately-pinned ref (a
      # cross-repo reusable-workflow call, which gets its own checkout context) passes that same
      # ref here explicitly, so what validate checks stays provably the same commit as what ships.
      ref:
        required: false
        type: string
        default: ''

jobs:

  # Source-only repo: lint plus a site build gated on the URL contract, using the same configs the editor uses.
  # There are no unit tests, because the thing under test is a set of URLs rather than a library.
  lint:
    name: Lint sources job
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:

      # Full history, because the mtime restore below has no commit to date a file from without it.
      - name: Checkout code step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      # Doc linters run as pinned action wrappers.
      # The editorconfig-checker action is install-only, so it runs via Docker instead.
      # The markdown glob excludes the imported archive and the vendored theme trees.
      # Neither is authored here, and .markdownlint-cli2.jsonc is carried verbatim so it cannot scope them.
      # The theme exclusion reaches inside a theme directory rather than all of themes/, so a file we author about a vendored tree is still linted.
      - name: Lint Markdown step
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !content/**
            !themes/*/**
            !public/**

      # The cspell gate covers README + HISTORY only.
      # Gating all *.md would mean endlessly padding cspell.json for technical terms.
      # Broad live spell-check is the editor extension's job.
      # See CODESTYLE.md "Markdown and Spelling".
      - name: Spell check step
        uses: streetsidesoftware/cspell-action@e0668cf020899e887ee8ad4d173c31738a79eae8 # v9.0.1
        with:
          files: |
            README.md
            HISTORY.md
          incremental_files_only: false

      - name: Lint workflows step
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Check EditorConfig step
        run: docker run --rm --pull=always -v "$PWD":/check --workdir /check mstruebing/editorconfig-checker:latest

      # The shell clean-compile is shellcheck at default severity plus `shfmt -d`, both reporting nothing.
      # The formatter reads .editorconfig, which pins the .sh files to tabs.
      # ops/vps-backup-pull carries no extension, so it takes the [*] default of four spaces instead.
      # Use `-d` rather than `-w` here and locally: the container writes as root and would take ownership of the tree.
      - name: Lint shell scripts step
        run: |
          set -Eeuo pipefail
          scripts=(checks/check-live-urls.sh deploy/make-release.sh ops/vps-backup-pull ops/install.sh capture/run-wp2hugo.sh)
          docker run --rm --pull=always -v "$PWD":/mnt --workdir /mnt \
            koalaman/shellcheck:stable "${scripts[@]}"
          docker run --rm --pull=always -v "$PWD":/mnt --workdir /mnt \
            mvdan/shfmt:latest -d "${scripts[@]}"

      - name: Validate config step
        run: |
          set -Eeuo pipefail
          for f in spec/*.json version.json .editorconfig-checker.json; do
            jq empty "$f"
          done
          python3 -c 'import yaml,sys; yaml.safe_load(open("hugo.yaml"))'

      # Every configuration value is described once, in ENVIRONMENT.md.
      # A new value gets added wherever its author is working, and nothing else notices a
      # missing row. Runs both directions: undocumented values, and rows describing nothing.
      - name: Check environment docs step
        run: python3 checks/check-env-docs.py

      # The pin lives in the action, so validation and the deploy cannot install different generators.
      - name: Install Hugo step
        uses: ./.github/actions/install-hugo

      # The same action the deploy uses, so the two agree on who restores the mtimes.
      - name: Restore file mtimes step
        uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3 # v2.3
        with:
          args: static

      # This is the build and URL-contract gate, not an extra step beside one.
      # The script runs `hugo --panicOnWarning` and check-url-parity itself, so a separate build would repeat both.
      # --panicOnWarning is the real gate, and two PaperMod templates are overridden in layouts/ so it can stay on.
      # 328 URLs must render, 778 legacy image URLs must resolve, and every local asset reference must exist.
      #
      # Running the script here is also the point: it was linted and never run, so a broken caller contract reached a deploy.
      # An empty scratch root exercises the deploy's path short of the transport, with no previous release for the hard-link guard.
      # REQUIRE_BROTLI stays unset, since installing brotli would cost an apt round trip per pull request.
      - name: Assemble release bundle step
        env:
          MTIME_RESTORED: '1'
        run: |
          set -Eeuo pipefail
          deploy/make-release.sh "${RUNNER_TEMP}/validate-bundle" "$(date -u +%Y%m%d-%H%M%S)"
