# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Workflow actions are the only ecosystem tracked here.
# The site has no package manifest, and the theme is vendored rather than pulled by a manager.
# The Pillow pin in scripts/requirements.txt is moved by hand, since a new Pillow changes the redaction output bytes.
# Both branches are targeted so each stays current independently of the release cadence.
version: 2
updates:

  - package-ecosystem: "github-actions"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions-deps:
        patterns:
          - "*"
