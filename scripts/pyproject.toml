# Tool configuration only, with the dependencies in requirements.txt beside it.

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.12"
platform = "linux"
files = ["."]
exclude = ['^\.venv/']

# The media gates sit in checks/, a directory of its own that this one's type check does not read.
[[tool.mypy.overrides]]
module = ["media_metadata_gate", "media_redactions_gate"]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = ["--cov=."]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*"]
