# Tool configuration only, with the dependencies in requirements.txt beside it.

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.12"
platform = "linux"
files = ["."]
exclude = ['^\.venv/']

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = ["--cov=."]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*"]
